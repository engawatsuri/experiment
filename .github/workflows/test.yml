name: Trunk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Setup Trunk
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install trunk

      - name: Build
        run: trunk build --release

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
